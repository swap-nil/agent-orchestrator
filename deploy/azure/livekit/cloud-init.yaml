#cloud-config
# LiveKit server for the test environment: livekit-server behind Caddy (automatic
# Let's Encrypt certificate for the VM's DNS name), both on the host network.
# The API key and secret are read from Key Vault with the VM's managed identity,
# so they never appear in the VM model or in this file. Placeholders (__X__) are
# filled in by main.bicep. Re-run /opt/livekit/bootstrap.sh after rotating keys.
package_update: true
packages: [docker.io, docker-compose-v2, python3, curl]

write_files:
  - path: /opt/livekit/docker-compose.yaml
    permissions: "0644"
    content: |
      services:
        livekit:
          image: livekit/livekit-server:v1.13.7
          command: ["--config", "/etc/livekit.yaml"]
          network_mode: host
          restart: unless-stopped
          volumes: ["./livekit.yaml:/etc/livekit.yaml:ro"]
        caddy:
          image: caddy:2.10-alpine
          network_mode: host
          restart: unless-stopped
          volumes: ["./Caddyfile:/etc/caddy/Caddyfile:ro", "caddy_data:/data", "caddy_config:/config"]
      volumes:
        caddy_data: {}
        caddy_config: {}

  - path: /opt/livekit/bootstrap.sh
    permissions: "0750"
    content: |
      #!/bin/bash
      set -euo pipefail
      KV="__KEY_VAULT__"
      FQDN="__LIVEKIT_FQDN__"
      EMAIL="__ACME_EMAIL__"
      cd /opt/livekit

      # Read a Key Vault secret with the VM identity; retry while the role assignment propagates.
      secret() {
        local name=$1 token value
        for _ in $(seq 1 90); do
          token=$(curl -sf -H Metadata:true \
            "http://169.254.169.254/metadata/identity/oauth2/token?api-version=2018-02-01&resource=https%3A%2F%2Fvault.azure.net" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["access_token"])') || token=""
          if [ -n "$token" ]; then
            if value=$(curl -sf -H "Authorization: Bearer $token" "https://$KV.vault.azure.net/secrets/$name?api-version=7.4" \
                | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])'); then
              printf '%s' "$value"
              return 0
            fi
          fi
          sleep 20
        done
        echo "could not read $name from Key Vault $KV" >&2
        return 1
      }

      KEY=$(secret livekit-api-key)
      SECRET=$(secret livekit-api-secret)
      umask 077
      cat > livekit.yaml <<EOF
      port: 7880
      logging:
        level: info
      rtc:
        tcp_port: 7881
        port_range_start: 50000
        port_range_end: 60000
        use_external_ip: true
      keys:
        "$KEY": "$SECRET"
      EOF
      cat > Caddyfile <<EOF
      {
        ${EMAIL:+email $EMAIL}
      }
      $FQDN {
        reverse_proxy 127.0.0.1:7880
      }
      EOF
      docker compose up -d --remove-orphans
      echo "LiveKit running at wss://$FQDN"

runcmd:
  - systemctl enable --now docker
  - /opt/livekit/bootstrap.sh > /var/log/livekit-bootstrap.log 2>&1
