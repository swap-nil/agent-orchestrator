{{- /*
The agent registry's audiences are rewritten to each agent's Entra app when
global.apps.agents maps agent name -> app (client) id, so on-behalf-of tokens
are requested for api://<app-id>/<skill>.
*/ -}}
{{- $agents := fromYaml (required "config.agentsYaml is required" .Values.config.agentsYaml) -}}
{{- $agentApps := (((.Values.global | default dict).apps | default dict).agents) | default dict -}}
{{- range $agents.agents }}
{{- if hasKey $agentApps .name }}{{ $_ := set . "audience" (printf "api://%s" (index $agentApps .name)) }}{{ end }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: orchestrator-config
  labels: {{- include "orch.labels" . | nindent 4 }}
data:
  orchestrator.yaml: |
{{ required "config.orchestratorYaml is required" .Values.config.orchestratorYaml | indent 4 }}
  intents.yaml: |
{{ required "config.intentsYaml is required" .Values.config.intentsYaml | indent 4 }}
  agents.yaml: |
{{ toYaml $agents | indent 4 }}
  evals.yaml: |
{{ required "config.evalsYaml is required (golden evals gate runtime changes)" .Values.config.evalsYaml | indent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: orchestrator-policy
  labels: {{- include "orch.labels" . | nindent 4 }}
data:
  orchestrator.rego: |
{{ .Files.Get "files/orchestrator.rego" | indent 4 }}
