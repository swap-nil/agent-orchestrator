apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: temporal-data
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: {{ .Values.temporal.storage.storageClassName }}
  resources: {requests: {storage: {{ .Values.temporal.storage.size }}}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal
  labels: {app.kubernetes.io/name: temporal, app.kubernetes.io/instance: {{ .Release.Name }}}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app.kubernetes.io/name: temporal}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: temporal}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: temporal
          image: {{ .Values.temporal.image }}
          args: ["server", "start-dev", "--ip", "0.0.0.0", "--ui-ip", "0.0.0.0",
                 "--db-filename", "/data/temporal.db", "--namespace", {{ .Values.temporal.namespace | quote }},
                 "--log-level", "warn"]
          env: [{name: HOME, value: /tmp}]
          ports:
            - {name: grpc, containerPort: 7233}
            - {name: ui, containerPort: 8233}
          readinessProbe: {tcpSocket: {port: grpc}, periodSeconds: 5}
          livenessProbe: {tcpSocket: {port: grpc}, initialDelaySeconds: 20, periodSeconds: 15}
          resources: {{- toYaml .Values.temporal.resources | nindent 12 }}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: data, persistentVolumeClaim: {claimName: temporal-data}}
        - {name: tmp, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: temporal
spec:
  selector: {app.kubernetes.io/name: temporal}
  ports:
    - {name: grpc, port: 7233, targetPort: grpc}
    # Web UI: reach it with `kubectl -n platform port-forward svc/temporal 8233` (not exposed publicly).
    - {name: ui, port: 8233, targetPort: ui}
