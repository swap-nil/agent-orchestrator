{{- $g := .Values.global | default dict -}}
{{- $ids := $g.identities | default dict -}}
{{- if .Values.keyVault.enabled }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: master-agent-kv
spec:
  provider: azure
  parameters:
    clientID: {{ $ids.masterAgent | quote }}
    keyvaultName: {{ required "global.keyVaultName is required" $g.keyVaultName | quote }}
    tenantId: {{ required "global.tenantId is required" $g.tenantId | quote }}
    objects: |
      array:
{{- range $kv, $env := .Values.keyVault.secrets }}
        - |
          objectName: {{ $kv }}
          objectType: secret
{{- end }}
  secretObjects:
    - secretName: master-agent-secrets
      type: Opaque
      data:
{{- range $kv, $env := .Values.keyVault.secrets }}
        - {objectName: {{ $kv }}, key: {{ $kv }}}
{{- end }}
{{- end }}
