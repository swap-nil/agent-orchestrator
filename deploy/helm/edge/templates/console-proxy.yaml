{{- $g := .Values.global | default dict -}}
{{- $apps := $g.apps | default dict -}}
{{- $ids := $g.identities | default dict -}}
{{- $secrets := dict "name" "console-proxy" "secrets" .Values.consoleProxy.keyVaultSecrets -}}
# The command center's authenticating proxy: operators sign in with Entra ID, and the
# proxy forwards their ID token (aud = console app, roles = CC.*) as the bearer token
# the orchestrator validates on every /admin/cc call.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.consoleProxy.serviceAccount }}
  annotations:
    azure.workload.identity/client-id: {{ required "global.identities.consoleProxy is required" $ids.consoleProxy | quote }}
---
{{ include "edge.spc" (dict "root" . "name" "console-proxy" "clientId" $ids.consoleProxy "secrets" .Values.consoleProxy.keyVaultSecrets) }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: console-proxy
  labels: {app.kubernetes.io/name: console-proxy, app.kubernetes.io/instance: {{ .Release.Name }}}
spec:
  replicas: {{ .Values.consoleProxy.replicas }}
  selector: {matchLabels: {app.kubernetes.io/name: console-proxy}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: console-proxy, azure.workload.identity/use: "true"}
    spec:
      serviceAccountName: {{ .Values.consoleProxy.serviceAccount }}
      {{- include "edge.podSecurity" 65532 | nindent 6 }}
      containers:
        - name: oauth2-proxy
          image: {{ .Values.consoleProxy.image }}
          args:
            - --http-address=0.0.0.0:4180
            - --provider=oidc
            - --oidc-issuer-url={{ include "edge.authority" . }}/{{ required "global.tenantId is required" $g.tenantId }}/v2.0
            - --client-id={{ required "global.apps.console is required" $apps.console }}
            - --redirect-url=https://{{ required "global.host is required" $g.host }}/oauth2/callback
            - --upstream={{ .Values.orchestratorUrl }}/
            - --scope=openid profile email offline_access
            - --email-domain=*
            - --oidc-email-claim=preferred_username
            - --insecure-oidc-allow-unverified-email=true
            - --code-challenge-method=S256
            - --pass-authorization-header=true
            - --reverse-proxy=true
            - --skip-provider-button=true
            - --cookie-name=_cc_session
            - --cookie-secure=true
            - --cookie-samesite=lax
            - --cookie-expire=8h
            - --cookie-refresh=30m
            - --flush-interval=200ms
            - --upstream-timeout=120s
            - --silence-ping-logging=true
          env:
            {{- include "edge.secretEnv" $secrets | nindent 12 }}
          ports: [{name: http, containerPort: 4180}]
          readinessProbe: {httpGet: {path: /ping, port: http}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /ping, port: http}, periodSeconds: 10}
          resources: {{- toYaml .Values.consoleProxy.resources | nindent 12 }}
          {{- include "edge.containerSecurity" . | nindent 10 }}
          volumeMounts: [{name: kv, mountPath: /mnt/secrets, readOnly: true}]
      volumes:
        - name: kv
          csi: {driver: secrets-store.csi.k8s.io, readOnly: true, volumeAttributes: {secretProviderClass: console-proxy-kv}}
---
apiVersion: v1
kind: Service
metadata:
  name: console-proxy
spec:
  selector: {app.kubernetes.io/name: console-proxy}
  ports: [{name: http, port: 4180, targetPort: http}]
