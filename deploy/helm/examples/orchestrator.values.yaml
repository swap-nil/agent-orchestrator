# Orchestrator chart, example values for a small AKS cluster. Used with the global
# values (global.example.yaml) and the config files, e.g. by 'make helm-lint':
#   --set-file config.orchestratorYaml=config/orchestrator.test.yaml (and intents, agents, evals)
cell: test-cell-01
replicaCount: 2
zoneSpread: ScheduleAnyway
worker:
  replicaCount: 1
  resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {memory: 512Mi}}
resources:
  requests: {cpu: 200m, memory: 384Mi}
  limits: {memory: 1Gi}
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70
podDisruptionBudget:
  minAvailable: 1
networkPolicy:
  enabled: true
  ingressNamespaces: [voice, edge]
  egressNamespaces: [agents, platform]
  # Must match your VNet (PostgreSQL delegated subnet, private endpoints).
  egressCidrs:
    - {cidr: 10.60.8.0/24, ports: [5432]}
    - {cidr: 10.60.9.0/24, ports: [10000]}
  egressPublicHttps: true
