<title>Agent Command Center</title>
<meta name="description" content="Real-time operations console for the multi-agent orchestrator: decisions, agents, safeguards, evals, governed runtime changes and kill switches.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2f4f7; --surface:#fcfcfb; --surface-2:#f6f7f9; --sunk:#eceff3; --ink:#0f1720; --ink-2:#4a5563; --muted:#7a8492;
  --line:#dde2e8; --line-strong:#c7ced7; --accent:#1d5fc4; --accent-ink:#ffffff; --accent-soft:#e3ecfa;
  --good:#0ca30c; --good-text:#006300; --good-soft:#e4f4e4; --warning:#fab219; --warning-text:#7a5200; --warning-soft:#fff3d6;
  --serious:#ec835a; --critical:#d03b3b; --critical-text:#b3261e; --critical-soft:#fbe6e4;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948;
  --grid:#e1e0d9; --axis:#c3c2b7;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:8px; --shadow:0 1px 2px rgba(15,23,32,.06),0 4px 16px rgba(15,23,32,.06);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0d1014; --surface:#161a1f; --surface-2:#1b2027; --sunk:#12161a; --ink:#e8edf3; --ink-2:#b4bdc8; --muted:#86909c;
  --line:#272e37; --line-strong:#36404b; --accent:#74a6f0; --accent-ink:#0b1320; --accent-soft:#1c2a40;
  --good-text:#3fcf52; --good-soft:#12301a; --warning-text:#f5c24d; --warning-soft:#33280d; --critical-text:#ff8a80; --critical-soft:#3a1715;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  --grid:#2c2c2a; --axis:#383835; --shadow:none;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0d1014; --surface:#161a1f; --surface-2:#1b2027; --sunk:#12161a; --ink:#e8edf3; --ink-2:#b4bdc8; --muted:#86909c;
  --line:#272e37; --line-strong:#36404b; --accent:#74a6f0; --accent-ink:#0b1320; --accent-soft:#1c2a40;
  --good-text:#3fcf52; --good-soft:#12301a; --warning-text:#f5c24d; --warning-soft:#33280d; --critical-text:#ff8a80; --critical-soft:#3a1715;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  --grid:#2c2c2a; --axis:#383835; --shadow:none;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.mono{font-family:var(--mono);font-size:12px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .ink2{color:var(--ink-2)}
h1,h2,h3{margin:0;text-wrap:balance}

/* shell */
.app{display:grid;grid-template-columns:216px minmax(0,1fr);min-height:100%;background:linear-gradient(90deg,var(--surface) 0 215px,var(--line) 215px 216px,var(--bg) 216px)}
.rail{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:18px;padding:18px 12px;background:var(--surface);border-right:1px solid var(--line)}
.brand{display:grid;gap:2px;padding:0 8px}
.brand b{font-weight:700;font-size:15px;letter-spacing:.01em}
.brand span{font-size:12px;color:var(--muted)}
.nav{display:grid;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border:0;border-radius:6px;background:none;text-align:left;cursor:pointer;color:var(--ink-2);font-weight:500}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--ink)}
.nav button[aria-current="page"] svg{color:var(--accent)}
.nav svg{width:16px;height:16px;flex:none}
.nav .count{margin-left:auto;font-size:11px;font-weight:600;border-radius:99px;padding:0 7px;background:var(--critical);color:#fff}
.rail-foot{margin-top:auto;display:grid;gap:8px;padding:0 8px;font-size:12px;color:var(--muted)}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:10px 20px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topbar h1{font-size:17px;font-weight:600;margin-right:auto}
.chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border:1px solid var(--line);border-radius:99px;background:var(--surface);font-size:12px;color:var(--ink-2);white-space:nowrap}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.chip.live .dot{background:var(--good);box-shadow:0 0 0 3px color-mix(in srgb,var(--good) 25%,transparent)}
.chip.demo .dot{background:var(--warning)}
.chip.down .dot{background:var(--critical)}
.seg{display:inline-flex;flex-wrap:wrap;max-width:100%;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:4px 10px;cursor:pointer;font-size:12px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
select,input[type=text],input[type=number],textarea{background:var(--surface);border:1px solid var(--line-strong);border-radius:6px;padding:5px 8px;min-width:0}
textarea{width:100%;font-family:var(--mono);font-size:12px;line-height:1.5;resize:vertical}
label.field{display:grid;gap:4px;font-size:12px;color:var(--ink-2);font-weight:500}
.content{padding:18px 20px 60px;display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-content:start}
#view,#evalsHost,#studioHost,#controlsHost,#auditHost{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;min-width:0}
.studio-grid{grid-template-columns:minmax(0,220px) minmax(0,1fr) minmax(0,380px);align-items:start}
.alertbar{display:grid;gap:6px}
.alert{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:8px 12px;border-radius:var(--r);border:1px solid var(--line);border-left:4px solid var(--warning);background:var(--surface)}
.alert.critical{border-left-color:var(--critical)}
.alert.acknowledged{opacity:.75}
.alert b{font-weight:600}
.alert .detail{color:var(--ink-2);font-size:12px}
.alert .btn{margin-left:auto}

/* building blocks */
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-2-1{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.g3-wide{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr) minmax(0,1fr)}
table.compact td,table.compact th{padding:6px 5px}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);min-width:0}
.panel-h{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:12px 14px 0}
.panel-h h2{font-size:14px;font-weight:600}
.panel-h .sub{font-size:12px;color:var(--muted)}
.panel-h .right{margin-left:auto;display:flex;gap:8px;align-items:center}
.panel-b{padding:12px 14px 14px}
.tile{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px 10px;display:grid;gap:4px;min-width:0}
.tile .label{font-size:12px;color:var(--ink-2);font-weight:500;display:flex;align-items:center;gap:6px}
.tile .value{font-size:26px;font-weight:600;line-height:1.1;letter-spacing:-.01em}
.tile .value small{font-size:13px;font-weight:500;color:var(--muted);margin-left:3px}
.tile .foot{font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center;justify-content:space-between}
.tile.warn{border-top:3px solid var(--warning);padding-top:10px}
.tile.crit{border-top:3px solid var(--critical);padding-top:10px}
.spark{display:block;width:100%;height:28px}
.btn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:6px;border:1px solid var(--line-strong);background:var(--surface);cursor:pointer;font-weight:500;font-size:13px;white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--ink-2)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{background:var(--critical);border-color:var(--critical);color:#fff}
.btn.ghost{border-color:transparent;background:none}
.btn.sm{height:26px;padding:0 9px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 8px;border-radius:99px;font-size:11.5px;font-weight:600;white-space:nowrap;border:1px solid transparent}
.pill svg{width:11px;height:11px}
.pill.good{background:var(--good-soft);color:var(--good-text)}
.pill.warn{background:var(--warning-soft);color:var(--warning-text)}
.pill.crit{background:var(--critical-soft);color:var(--critical-text)}
.pill.info{background:var(--accent-soft);color:var(--ink)}
.pill.neutral{background:var(--sunk);color:var(--ink-2)}
.risk{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:18px;padding:0 5px;border-radius:4px;font:600 11px/1 var(--mono);border:1px solid var(--line-strong);color:var(--ink-2);background:var(--surface)}
.risk.R2{border-color:var(--ink-2);color:var(--ink)}
.risk.R3{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-weight:600;font-size:12px;color:var(--ink-2);text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
td.r.num{white-space:nowrap}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface-2)}
tr.sel td{background:var(--accent-soft)}
.empty{padding:28px 14px;text-align:center;color:var(--muted);font-size:13px}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{font-family:var(--sans);font-size:11px;fill:var(--muted)}
.bars{display:grid;gap:7px}
.bar-row{display:grid;grid-template-columns:minmax(90px,38%) 1fr auto;gap:10px;align-items:center;font-size:12.5px}
.bar-row .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)}
.bar-track{height:8px;border-radius:0 4px 4px 0;background:var(--sunk);overflow:hidden}
.bar-fill{height:100%;background:var(--s1);border-radius:0 4px 4px 0}
.meter{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.meter i{display:block;height:100%;background:var(--s1)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.stack{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);padding:0 14px}
.tabs button{border:0;background:none;padding:8px 10px;cursor:pointer;color:var(--ink-2);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.feed{max-height:560px;overflow:auto}
.feed td{padding:5px 8px;font-size:12.5px}
.evt{display:inline-block;font:500 11px/18px var(--mono);padding:0 6px;border-radius:4px;background:var(--sunk);color:var(--ink-2);white-space:nowrap}
.evt.g-guard{background:var(--warning-soft);color:var(--warning-text)}
.evt.g-policy{background:var(--accent-soft);color:var(--ink)}
.evt.g-control{background:var(--ink);color:var(--surface)}
.evt.g-alert{background:var(--critical-soft);color:var(--critical-text)}
.new-row td{animation:flash 1.2s ease-out}
@keyframes flash{from{background:var(--accent-soft)}to{background:transparent}}
.toggle{position:relative;width:34px;height:20px;flex:none}
.toggle input{position:absolute;inset:0;z-index:1;opacity:0;margin:0;cursor:pointer}
.toggle span{position:absolute;inset:0;border-radius:99px;background:var(--good);transition:background .15s}
.toggle span::after{content:"";position:absolute;top:3px;left:17px;width:14px;height:14px;border-radius:50%;background:#fff;transition:left .15s}
.toggle input:not(:checked)+span{background:var(--critical)}
.toggle input:not(:checked)+span::after{left:3px}
.toggle input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.switch-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.switch-row:last-child{border-bottom:0}
.switch-row .name{flex:1;min-width:0}
.staged{outline:2px dashed var(--accent);outline-offset:2px;border-radius:99px}
/* drawer */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);z-index:40;background:var(--surface);border-left:1px solid var(--line);box-shadow:-8px 0 30px rgba(0,0,0,.15);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.drawer-h{display:flex;align-items:flex-start;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.drawer-h h2{font-size:15px}
.drawer-b{overflow:auto;padding:14px 16px 40px;display:grid;gap:14px;align-content:start}
.timeline{display:grid;gap:0;position:relative}
.stage{display:grid;grid-template-columns:18px 1fr;gap:10px;padding-bottom:14px;position:relative}
.stage::before{content:"";position:absolute;left:8px;top:18px;bottom:0;width:2px;background:var(--line)}
.stage:last-child::before{display:none}
.stage .mark{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;background:var(--sunk);color:var(--ink-2)}
.stage .mark svg{width:11px;height:11px}
.stage.ok .mark{background:var(--good-soft);color:var(--good-text)}
.stage.warn .mark{background:var(--warning-soft);color:var(--warning-text)}
.stage.block .mark{background:var(--critical-soft);color:var(--critical-text)}
.stage h4{margin:0;font-size:13px;font-weight:600;display:flex;gap:8px;align-items:baseline}
.stage h4 .mono{color:var(--muted);font-weight:400}
.stage p{margin:2px 0 0;font-size:13px;color:var(--ink-2)}
.stage details{margin-top:4px;font-size:12px}
.stage pre{margin:4px 0 0;padding:8px;background:var(--sunk);border-radius:6px;overflow:auto;font:11.5px/1.5 var(--mono);max-height:200px}
/* modal */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(10,15,20,.45);display:grid;place-items:center;padding:16px}
.modal{width:min(460px,100%);background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,.3);display:grid;gap:12px;padding:18px}
.modal h3{font-size:16px}
.modal p{margin:0;color:var(--ink-2)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--surface);padding:9px 14px;border-radius:8px;font-size:13px;box-shadow:0 8px 30px rgba(0,0,0,.25);max-width:calc(100% - 32px)}
.toast.err{background:var(--critical);color:#fff}
.tip{position:fixed;z-index:70;pointer-events:none;background:var(--surface);border:1px solid var(--line-strong);border-radius:6px;box-shadow:0 6px 24px rgba(0,0,0,.18);padding:7px 9px;font-size:12px;min-width:120px}
.tip .t{color:var(--muted);margin-bottom:3px}
.tip .r{display:grid;grid-template-columns:12px 1fr auto;gap:6px;align-items:center}
.tip .r i{height:2px;border-radius:1px}
.tip .r b{font-variant-numeric:tabular-nums}
.diff{display:grid;gap:6px;font:12px/1.5 var(--mono)}
.diff .del{background:var(--critical-soft);color:var(--critical-text);padding:1px 6px;border-radius:4px;text-decoration:line-through;text-decoration-thickness:1px}
.diff .add{background:var(--good-soft);color:var(--good-text);padding:1px 6px;border-radius:4px}
.gate{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:var(--r);border:1px solid var(--line)}
.gate.pass{background:var(--good-soft);border-color:transparent}
.gate.fail{background:var(--critical-soft);border-color:transparent}
.gate svg{width:18px;height:18px;flex:none;margin-top:1px}
.versions{display:grid;gap:0}
.ver{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.ver:last-child{border-bottom:0}
.ver .v{font:600 12px var(--mono);padding:2px 6px;border-radius:4px;background:var(--sunk)}
.ver.active .v{background:var(--ink);color:var(--surface)}
.list-btn{min-width:0;display:flex;align-items:center;gap:8px;width:100%;padding:8px 10px;border:1px solid transparent;border-radius:6px;background:none;cursor:pointer;text-align:left}
.list-btn:hover{background:var(--surface-2)}
.list-btn[aria-current="true"]{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 30%,transparent)}
.hint{font-size:12px;color:var(--muted)}
.callout{padding:10px 12px;border-radius:var(--r);background:var(--sunk);font-size:13px;color:var(--ink-2)}
.callout.warn{background:var(--warning-soft);color:var(--warning-text)}
.nowrap{white-space:nowrap}
@media (max-width:1280px){.studio-grid{grid-template-columns:minmax(0,200px) minmax(0,1fr)}.studio-grid>.stack{grid-column:1/-1}}
@media (max-width:1100px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.g3,.g3-wide{grid-template-columns:1fr 1fr}.g-2-1{grid-template-columns:1fr}}
@media (max-width:820px){
  .app{grid-template-columns:1fr;background:var(--bg)}
  .rail{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;height:auto;flex-direction:row;align-items:center;gap:8px;padding:8px 12px;border-right:0;border-bottom:1px solid var(--line);overflow-x:auto}
  .brand span,.rail-foot{display:none}
  .brand b{font-size:13px;white-space:nowrap}
  .nav{display:flex;gap:2px}
  .nav button{padding:6px 9px;white-space:nowrap}
  .nav button svg{display:none}
  .topbar{position:static;padding:10px 16px}
  .content{padding:14px 16px 60px}
  .g2,.g3,.g3-wide,.studio-grid{grid-template-columns:minmax(0,1fr)}
  .panel-h .sub{flex-basis:100%}
}
@media (max-width:480px){.tiles{grid-template-columns:1fr 1fr}.tile .value{font-size:22px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="app" id="app">
  <aside class="rail">
    <div class="brand"><b>Agent Command Center</b><span id="cellLabel">connecting…</span></div>
    <nav class="nav" id="nav" aria-label="Sections"></nav>
    <div class="rail-foot">
      <div id="clock" class="num"></div>
      <div id="railMode"></div>
    </div>
  </aside>
  <div class="main">
    <header class="topbar">
      <h1 id="viewTitle">Overview</h1>
      <span class="chip" id="modeChip"><span class="dot"></span><span id="modeText">Connecting</span></span>
      <div class="seg" role="group" aria-label="Time window" id="windowSeg"></div>
      <label class="chip" id="operatorWrap" hidden>Operator
        <select id="operatorSel" aria-label="Operator (development and demo only)"></select>
      </label>
    </header>
    <div class="content" id="content">
      <div class="alertbar" id="alertbar"></div>
      <div id="view"></div>
    </div>
  </div>
</div>
<div id="drawerRoot"></div>
<div id="modalRoot"></div>
<div id="toastRoot"></div>
<div class="tip" id="tip" hidden></div>

<script>
"use strict";

async function sha256(text) {
  if (!(window.crypto && crypto.subtle)) return "0".repeat(64);
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf), b => b.toString(16).padStart(2, "0")).join("");
}
function percentile(values, p) {
  if (!values.length) return null;
  const o = [...values].sort((a, b) => a - b), k = (o.length - 1) * p, lo = Math.floor(k), hi = Math.ceil(k);
  return lo === hi ? Math.round(o[lo] * 10) / 10 : Math.round((o[lo] + (o[hi] - o[lo]) * (k - lo)) * 10) / 10;
}

/* ------------------------------------------------------------------ data refresh */

/* ------------------------------------------------------------------ feed */
const GROUPS = {turns: ["turn_received", "routed", "planned", "turn_completed", "turn_replayed", "turn_error", "shadow_routed"], policy: ["policy_checked", "policy_denied", "plan_rejected"], guard: ["input_blocked", "output_checked", "output_blocked"], agents: ["step_result", "write_step_result"], tx: ["approval_requested", "approval_decided", "transaction_completed", "transaction_failed", "transaction_expired", "transaction_declined"], control: []};
function groupOf(ev) { if (ev.chain === "control-plane") return "control"; if (ev.chain === "alerts") return "alert"; for (const [g, list] of Object.entries(GROUPS)) if (list.includes(ev.event)) return g; return "turns"; }
function summarize(ev) {
  const d = ev.data || {};
  switch (ev.event) {
    case "turn_received": return `Heard ${d.text ? `“${esc(d.text)}”` : ""}${(d.flags || []).length ? ` <span class="muted">${esc(d.flags.join(", "))}</span>` : ""}`;
    case "routed": return d.intent ? `${riskChip(d.risk)} ${esc(d.intent)} <span class="muted">${esc(d.source)} · confidence ${d.confidence}${d.clarify ? " · clarify" : ""}</span>` : `Clarify <span class="muted">${esc((d.candidates || []).join(" / ") || "no match")}</span>`;
    case "planned": return `${(d.steps || []).length} step(s), cost ${d.cost_units}${(d.skipped_optional || []).length ? ` <span class="muted">skipped ${esc(d.skipped_optional.join(", "))}</span>` : ""}${d.valid === false ? ` <span class="muted">rejected</span>` : ""}`;
    case "policy_checked": { const den = (d.decisions || []).filter(x => !x.allow); return den.length ? `Denied ${esc(den[0].step)}: ${esc((den[0].reasons || []).join("; "))}` : `Allowed ${(d.decisions || []).length} step(s)`; }
    case "policy_denied": case "plan_rejected": return esc((d.reasons || []).join("; "));
    case "step_result": case "write_step_result": return `${esc(d.agent)} · ${esc(d.skill || d.step)} <span class="muted">${esc(String(d.state || "").replace("TASK_STATE_", "").toLowerCase())}${d.latency_ms ? " · " + fmtMs(d.latency_ms) : ""}${(d.attempts || 1) > 1 ? ` · ${d.attempts} attempts` : ""}${d.error ? " · " + esc(d.error) : ""}</span>`;
    case "output_checked": return `${(d.sources || []).length} source(s)${d.dropped ? `, ${d.dropped} dropped` : ""}${(d.flags || []).includes("disclaimer_added") ? ", disclaimer added" : ""}`;
    case "output_blocked": case "input_blocked": return esc((d.flags || []).filter(f => !f.startsWith("pii:")).join(", "));
    case "turn_completed": return `${outcomePill(d.type)} <span class="muted num">${fmtMs(d.latency_ms)}${(d.reasons || []).length ? " · " + esc(d.reasons.join(", ")) : ""}</span>`;
    case "shadow_routed": return `${d.agrees ? "Agrees" : "Differs"} <span class="muted">live ${esc(d.live)} · candidate ${esc(d.candidate)}</span>`;
    case "approval_requested": return `Waiting for approval <span class="mono muted">${esc(String(d.action_hash).slice(0, 10))}…</span>`;
    case "approval_decided": return d.approved ? "Approved with step-up" : `Not approved: ${esc((d.reasons || []).join("; "))}`;
    case "kill_switch_changed": return `Kill switch by <b>${esc(d.operator_name || d.actor)}</b>: ${esc(Object.entries(d.flags || {}).filter(([, v]) => v.length).map(([k, v]) => k.replace("disabled_", "") + " " + v.join(", ")).join("; ") || "all enabled")} <span class="muted">${esc(d.reason || "")}</span>`;

}
function onEvent(ev) {

function matchesFeed(ev) { if (STATE.feedSession && !ev.session_id.includes(STATE.feedSession)) return false; if (STATE.feedFilter === "all") return true; const g = groupOf(ev); return STATE.feedFilter === g || (STATE.feedFilter === "control" && (g === "control" || g === "alert")); }
function feedRow(ev, fresh) { return `<tr class="click ${fresh ? "new-row" : ""}" data-sid="${esc(ev.session_id)}" data-tid="${esc(ev.turn_id)}" tabindex="0"><td class="num mono nowrap">${zurichTime(ev.ts)}</td><td class="mono nowrap">${esc(ev.chain === "control-plane" || ev.chain === "alerts" ? ev.chain : shortId(ev.session_id))}</td><td><span class="evt g-${groupOf(ev)}">${esc(ev.event)}</span></td><td>${summarize(ev)}</td></tr>`; }

/* ------------------------------------------------------------------ views */
function health(agent, row, ov) {

  if (!row || !row.calls) return ["neutral", "Idle"]; if (row.error_rate >= 0.2) return ["crit", "Failing"]; if (row.error_rate >= 0.05 || (row.p95_ms || 0) > 1500) return ["warn", "Degraded"]; return ["good", "Healthy"];

  host.innerHTML = `
  <section class="panel"><div class="panel-h"><h2>Operator actions</h2><span class="sub">control-plane chain · every record carries the hash of the previous one</span><div class="right">${a.valid ? statusPill("good", `Chain verified · ${a.records} records`) : statusPill("crit", `Chain broken at ${a.first_invalid_index}`)}<button class="btn sm" id="reverify">Verify again</button></div></div>
    <div class="panel-b tablewrap"><table><thead><tr><th>#</th><th>When</th><th>Action</th><th>By</th><th>Details</th><th>Hash</th></tr></thead><tbody>${a.entries.map(e => { const [who, det] = describe(e); return `<tr><td class="num mono">${e.seq}</td><td class="num nowrap">${zurichDateTime(e.ts)}</td><td><span class="evt g-control">${esc(e.event)}</span></td><td>${esc(who)}</td><td>${esc(det)}</td><td class="mono muted" title="${esc(e.hash)}">${esc(e.hash.slice(0, 12))}…</td></tr>`; }).join("") || `<tr><td colspan="6" class="empty">No operator actions yet</td></tr>`}</tbody></table></div></section>
  <section class="grid g2">
    <div class="panel"><div class="panel-h"><h2>Active alerts</h2></div><div class="panel-b">${al.active.length ? al.active.map(x => `<div class="switch-row"><span class="name"><b>${esc(x.title)}</b><div class="hint">${esc(x.detail)} · since ${zurichTime(x.fired_at)}${x.acknowledged_by ? ` · acknowledged by ${esc(x.acknowledged_by)}` : ""}</div></span>${statusPill(x.severity === "critical" ? "crit" : "warn", x.severity)}</div>`).join("") : '<div class="empty">No active alerts</div>'}</div></div>
    <div class="panel"><div class="panel-h"><h2>Resolved alerts</h2></div><div class="panel-b">${al.history.length ? al.history.slice(0, 12).map(x => `<div class="switch-row"><span class="name">${esc(x.title)}<div class="hint">${zurichDateTime(x.fired_at)} → ${zurichTime(x.resolved_at)}${x.acknowledged_by ? ` · handled by ${esc(x.acknowledged_by)}${x.ack_note ? `: ${esc(x.ack_note)}` : ""}` : ""}</div></span><span class="pill neutral">resolved</span></div>`).join("") : '<div class="empty">No resolved alerts yet</div>'}</div></div>
  </section>
  <section class="panel"><div class="panel-h"><h2>Alert rules</h2><span class="sub">from command_center.alert_rules</span></div><div class="panel-b tablewrap"><table><thead><tr><th>Rule</th><th>Metric</th><th>Condition</th><th>Window</th><th>Min samples</th><th>Severity</th></tr></thead><tbody>${al.rules.map(r => `<tr><td>${esc(r.description || r.id)}</td><td class="mono">${esc(r.metric)}</td><td class="mono">${esc(r.op)} ${esc(r.threshold)}</td><td class="num">${r.window_s}s</td><td class="num">${r.min_samples}</td><td>${statusPill(r.severity === "critical" ? "crit" : "warn", r.severity)}</td></tr>`).join("")}<tr><td>Circuit breaker open (built in)</td><td class="mono">breakers.*</td><td class="mono">state = open</td><td>–</td><td>–</td><td>${statusPill("crit", "critical")}</td></tr><tr><td>Audit ledger write failures (built in)</td><td class="mono">audit.errors</td><td class="mono">&gt; 0</td><td>–</td><td>–</td><td>${statusPill("crit", "critical")}</td></tr></tbody></table></div></section>`;
  $("#reverify").onclick = () => { loadAudit(); toast("Chain recomputed"); };
}

/* ------------------------------------------------------------------ render */
function render(soft = false) {
  const v = $("#view"), view = STATE.view;
  if (soft && view === "overview" && $("#chOutcomes")) { const keepTable = $$("[data-table-toggle][aria-pressed=true]").length; if (!keepTable) { v.innerHTML = viewOverview(); bindCommon(v); renderTicker(); drawOverviewCharts(); } return; }
  if (soft && (view === "agents" || view === "safeguards")) { v.innerHTML = view === "agents" ? viewAgents() : viewSafeguards(); bindCommon(v); return; }
  if (soft) return;
  STATE.redraw = null;
  const html = {overview: viewOverview, live: viewLive, agents: viewAgents, safeguards: viewSafeguards, evals: viewEvals, studio: viewStudio, controls: viewControls, audit: viewAudit}[view]();
  v.innerHTML = html; bindCommon(v);
  if (view === "overview") { renderTicker(); drawOverviewCharts(); STATE.redraw = drawOverviewCharts; }
  if (view === "live") { bindFeedRows($$("#feedBody tr")); loadSessions(); $("#pauseBtn").onclick = () => { STATE.feedPaused = !STATE.feedPaused; render(); }; $$("[data-f]").forEach(b => b.onclick = () => { STATE.feedFilter = b.dataset.f; render(); }); const sf = $("#sessFilter"); sf.oninput = () => { STATE.feedSession = sf.value.trim(); const tb = $("#feedBody"); tb.innerHTML = STATE.feed.filter(matchesFeed).slice(-300).reverse().map(e => feedRow(e, false)).join(""); bindFeedRows($$("tr", tb)); }; }
  if (view === "evals") loadEvals().catch(e => toast(e.message, true));
  if (view === "studio") loadStudio(true).catch(e => toast(e.message, true));
  if (view === "controls") { STATE.staged = null; loadControls().catch(e => toast(e.message, true)); }
  if (view === "audit") loadAudit().catch(e => toast(e.message, true));
}
function bindCommon(root) {
  bindTableToggles(root);
  $$("[data-go]", root).forEach(b => b.onclick = () => go(b.dataset.go));
  $$("[data-reset]", root).forEach(b => { if (!b.onclick) b.onclick = () => ask({title: `Reset ${b.dataset.reset} breaker`, body: "Calls resume immediately. If the agent is still failing, the breaker opens again after 5 failures.", placeholder: "For example: vendor confirmed recovery", confirm: "Reset breaker"}, async r => { await API.post(`/breakers/${encodeURIComponent(b.dataset.reset)}/reset`, {reason: r}); toast("Breaker reset"); refresh(true); }); });
  $$("[data-kill-agent]", root).forEach(b => b.onclick = () => { const a = b.dataset.killAgent, ks = STATE.overview.kill_switch, off = ks.disabled_agents.includes(a); ask({title: `${off ? "Enable" : "Disable"} ${a}`, body: off ? "Calls to this agent resume on every replica within about 5 seconds." : "No turn will call this agent. Intents that need it are refused or answered partially.", placeholder: off ? "For example: fix deployed and verified" : "For example: INC-4471 vendor outage", confirm: off ? "Enable" : "Disable", danger: !off}, async r => { const next = {...ks, disabled_agents: off ? ks.disabled_agents.filter(x => x !== a) : [...ks.disabled_agents, a]}; await API.put("/kill-switch", {...next, reason: r}); toast(`${a} ${off ? "enabled" : "disabled"}`); refresh(true); }); });
}

/* ------------------------------------------------------------------ boot */
let resizeT = null;
window.addEventListener("resize", () => { clearTimeout(resizeT); resizeT = setTimeout(() => { if (STATE.redraw) STATE.redraw(); }, 150); });
function tickClock() { $("#clock").textContent = "Zürich " + new Date().toLocaleTimeString("de-CH", {timeZone: "Europe/Zurich"}); }
async function boot() {
  [API, STATE.me] = await detect();
  const h = location.hash.replace("#", ""); if (VIEWS.some(v => v[0] === h)) STATE.view = h;
  renderShell(); $("#viewTitle").textContent = VIEWS.find(v => v[0] === STATE.view)[1];
  if (API.mode === "demo") STATE.feed = API.p.events.slice(-600).map(e => API.project(e));
  else { try { STATE.feed = (await API.get("/events", {limit: 500})).events; } catch (e) {} }
  await refresh(true); render();
  stopStream = API.stream(onEvent, st => { const c = $("#modeChip"); if (st === "reconnecting") { c.className = "chip down"; $("#modeText").textContent = "Reconnecting…"; } else renderShell(); });
  setInterval(() => refresh(), 3000); tickClock(); setInterval(tickClock, 1000);
}
boot().catch(e => { $("#view").innerHTML = `<div class="panel"><div class="empty">The console could not start: ${esc(e.message)}</div></div>`; });
</script>
