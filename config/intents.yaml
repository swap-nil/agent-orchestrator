# Intent catalogue. Each intent maps user requests to a deterministic plan.
# Risk classes: R0 information, R1 personalised read, R2 advice, R3 transaction.
# Patterns are case-insensitive regular expressions; R2 and R3 are only ever
# reached through these rules, never through a model classifier.
# exclude_patterns veto an intent; label names it in "did you mean A or B?"
# questions; slots are filled from the user's words by fixed rules (see
# orchestrator/slots.py) and required slots are asked for before any agent runs.
intents:
  - id: faq.general
    risk: R0
    description: General bank information
    label: general information about the bank
    required_acr: low
    patterns:
      - "opening hours|branch|fees? for|how do i|what is (a|an|the)"
    # "What is the smallest position in my portfolio?" is about the customer's own holdings, not the bank,
    # unless it asks about fees, interest or branches.
    exclude_patterns:
      - "^(?!.*\\b(fees?|charges?|costs?|interest|opening hours|branch(es)?)\\b).*\\bmy (portfolios?|holdings|positions|investments)\\b"
    steps:
      - id: answer
        agent: faq-agent
        skill: faq.answer
        data_classes: [public]
        include_query: true
        instruction: >-
          Answer the customer's general question (data.query) from the approved knowledge base only.
          If no article answers it, reply input-required without text.

  - id: portfolio.overview
    risk: R1
    description: Portfolio overview with current prices
    label: an overview of your portfolio
    required_acr: standard
    quorum: all
    patterns:
      - "\\b(my )?(portfolios?|holdings|positions|investments)\\b"
      - "how (is|are) my (investments|portfolios?)( doing)?"
      - "\\bwhat do i (own|hold|have invested)\\b"
    clarification_prompt: Would you like an overview of your whole portfolio or one account?
    # A specific question ("how many portfolios", "my smallest position") gets a direct answer, without market prices.
    slots:
      - name: focus
        kind: focus
    steps:
      - id: holdings
        agent: portfolio-agent
        skill: portfolio.holdings
        data_classes: [client_confidential]
        instruction: >-
          Answer the question named in data.slots.focus (accounts, count, smallest, largest, total or list)
          from the client's holdings; without a focus, summarise them.
      - id: prices
        agent: market-agent
        skill: market.quotes
        optional: true
        skip_if_slot: focus
        data_classes: [public]
        instruction: Provide current prices for major indices.

  - id: advice.rebalance
    risk: R2
    description: Rebalancing suggestion checked for suitability
    label: a rebalancing suggestion
    required_acr: standard
    patterns:
      - "\\brebalanc(e|ing)\\b"
      - "should i (change|adjust) my (allocation|portfolio)"
      - "\\bshould i (sell|buy|keep|hold on to|reduce|increase)\\b"
      - "\\b(is it (wise|a good idea)|do you (think|recommend)|would you recommend)\\b.*\\b(sell|buy|invest)"
    steps:
      - id: holdings
        agent: portfolio-agent
        skill: portfolio.holdings
        data_classes: [client_confidential]
      - id: proposal
        agent: advice-agent
        skill: advice.rebalance
        depends_on: [holdings]
        data_classes: [client_confidential]
        instruction: Draft a rebalancing suggestion within the client's risk profile.
      - id: suitability
        agent: compliance-agent
        skill: compliance.suitability
        depends_on: [proposal]
        data_classes: [client_confidential]
        instruction: Check the draft for suitability and return the approved wording only.

  - id: trade.sell
    risk: R3
    description: Sell part of a position
    label: to sell part of a holding
    required_acr: standard
    patterns:
      - "\\bsell\\b.*\\b(shares?|units?|etf|fund|position|stock)"
      - "^\\W*((please|ok(ay)?|now|so|i want to|i'd like to|i would like to|can you|could you|go ahead and)\\s+)*sell\\b"
    # Questions about selling are advice or information, never an order.
    exclude_patterns:
      - "^\\W*(should|shall|would|could) (i|we)\\b"
      - "\\b(is it (wise|a good idea)|do you (think|recommend)|would you recommend|how (do|can|would) i)\\b"
    slots:
      - name: instrument
        kind: instrument
        required: true
        prompt: Which of your holdings would you like to sell?
      - name: quantity
        kind: quantity
        required: true
        prompt: How much of the {instrument} would you like to sell? You can say a number of units, half, or all of it.
    readback_template: >-
      You are about to sell {quantity} units of {instrument} from account {account_mask}
      at market price, estimated {estimated_amount} {currency}.
    steps:
      - id: holdings
        agent: portfolio-agent
        skill: portfolio.holdings
        data_classes: [client_confidential]
      - id: prepare
        agent: trade-agent
        skill: trade.prepare
        depends_on: [holdings]
        data_classes: [client_confidential]
        instruction: >-
          Prepare (do not place) a sell order for exactly the holding and quantity in data.slots and return it
          as data.action. If the holding is not held or is ambiguous, or the quantity exceeds the position,
          reply input-required with a question and data.missing naming the slot to ask for again.
      - id: execute
        agent: trade-agent
        skill: trade.execute
        mode: write
        depends_on: [prepare]
        data_classes: [client_confidential]
        timeout_ms: 4000
        instruction: Place the approved order exactly as approved.
