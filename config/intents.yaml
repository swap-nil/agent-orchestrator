# Intent catalogue. Each intent maps user requests to a deterministic plan.
# Risk classes: R0 information, R1 personalised read, R2 advice, R3 transaction.
# Patterns are case-insensitive regular expressions; R2 and R3 are only ever
# reached through these rules, never through a model classifier.
intents:
  - id: faq.general
    risk: R0
    description: General bank information
    required_acr: low
    patterns:
      - "opening hours|branch|fees? for|how do i|what is (a|an|the)"
    steps:
      - id: answer
        agent: faq-agent
        skill: faq.answer
        data_classes: [public]
        instruction: Answer the customer's general question from the approved knowledge base.

  - id: portfolio.overview
    risk: R1
    description: Portfolio overview with current prices
    required_acr: standard
    quorum: all
    patterns:
      - "\\b(my )?(portfolio|holdings|positions)\\b"
      - "how (is|are) my (investments|portfolio) doing"
    clarification_prompt: Would you like an overview of your whole portfolio or one account?
    steps:
      - id: holdings
        agent: portfolio-agent
        skill: portfolio.holdings
        data_classes: [client_confidential]
        instruction: Summarise the client's current holdings.
      - id: prices
        agent: market-agent
        skill: market.quotes
        optional: true
        data_classes: [public]
        instruction: Provide current prices for major indices.

  - id: advice.rebalance
    risk: R2
    description: Rebalancing suggestion checked for suitability
    required_acr: standard
    patterns:
      - "\\brebalanc(e|ing)\\b"
      - "should i (change|adjust) my (allocation|portfolio)"
    steps:
      - id: holdings
        agent: portfolio-agent
        skill: portfolio.holdings
        data_classes: [client_confidential]
      - id: proposal
        agent: advice-agent
        skill: advice.rebalance
        depends_on: [holdings]
        data_classes: [client_confidential]
        instruction: Draft a rebalancing suggestion within the client's risk profile.
      - id: suitability
        agent: compliance-agent
        skill: compliance.suitability
        depends_on: [proposal]
        data_classes: [client_confidential]
        instruction: Check the draft for suitability and return the approved wording only.

  - id: trade.sell
    risk: R3
    description: Sell part of a position
    required_acr: standard
    patterns:
      - "\\bsell\\b.*\\b(shares?|units?|etf|fund|position|stock)"
    readback_template: >-
      You are about to sell {quantity} units of {instrument} from account {account_mask}
      at market price, estimated {estimated_amount} {currency}.
    steps:
      - id: holdings
        agent: portfolio-agent
        skill: portfolio.holdings
        data_classes: [client_confidential]
      - id: prepare
        agent: trade-agent
        skill: trade.prepare
        depends_on: [holdings]
        data_classes: [client_confidential]
        instruction: Prepare (do not place) a sell order and return it as data.action.
      - id: execute
        agent: trade-agent
        skill: trade.execute
        mode: write
        depends_on: [prepare]
        data_classes: [client_confidential]
        timeout_ms: 4000
        instruction: Place the approved order exactly as approved.
