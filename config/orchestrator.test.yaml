# Azure test environment (one VM, Docker Compose: deploy/azure/vm). Production
# components and Entra ID everywhere; differences from prod are listed in
# docs/AZURE_TEST_ENV.md. Tenant-specific values (tenant id, app ids, caller
# identities, hosts) are NOT in this file: deploy/azure/deploy.sh generates them
# as ORCH__... environment overrides (env/orchestrator.env on the VM), so this
# file validates on its own.
#
# profile stays "dev" only because traffic between the containers is plain HTTP
# (no service mesh on the VM); every other production rule is followed.
profile: dev
service:
  name: orchestrator
  environment: test
  cell_id: test-cell-01
  region: switzerlandnorth
  log_level: INFO
auth:
  # Callers present Entra app-only tokens of their managed identities; route_callers
  # lists the managed identity client ids (set by deploy.sh).
  mode: jwt
  jwt:
    algorithms: [RS256]
  user_subject_claim: oid
  user_tenant_claim: tid
  # Test tenants rarely have Conditional Access authentication contexts, so the
  # assurance level is carried by app roles on the orchestrator app (values
  # low, standard, stepup). Approvals additionally force an interactive re-login.
  user_acr_claim: roles
  acr_levels: [low, standard, stepup]
  approval_min_acr: stepup
  user_jwt:
    algorithms: [RS256]
catalogue:
  intents_file: /app/config/intents.yaml
  # The registry with each agent's Entra app as audience, generated by deploy.sh.
  registry_file: /etc/orchestrator/agents.yaml
routing:
  fallback_intent: faq.general
budgets:
  turn_deadline_ms: 2500
execution:
  default_step_timeout_ms: 1500
  read_retries: 2
a2a:
  gateway_url: http://a2a-gateway:8080
policy:
  engine: opa
  opa_url: http://opa:8181
  timeout_ms: 250
identity:
  mode: entra_obo
  # Managed identity token from IMDS as the federated assertion (the orchestrator
  # app trusts the orchestrator's managed identity; AZURE_CLIENT_ID selects it).
  client_auth: managed_identity
  sender_constraint: mtls
session:
  store: redis
  redis_url_env: ORCH_REDIS_URL
  token_encryption_key_env: ORCH_SESSION_KEY
audit:
  sink: postgres
  postgres_dsn_env: ORCH_AUDIT_DSN
  fail_turn_on_audit_error: true
guards:
  injection_action: block
workflows:
  enabled: true
  temporal_target: temporal:7233
  namespace: orchestrator-test
  task_queue: orchestrator-transactions
  approval_timeout_s: 600
telemetry:
  enabled: true
  otlp_endpoint: http://otel-collector:4317
  capture_content: false
command_center:
  enabled: true
  event_bus: redis
  stream_key: orch:test-cell-01:events
  operator_auth: jwt
  operator_jwt:
    algorithms: [RS256]
  # Testers see (PII-redacted) utterances when they hold CC.Investigator.
  show_utterances: true
  require_four_eyes: true
  evals_file: /app/config/evals.yaml
