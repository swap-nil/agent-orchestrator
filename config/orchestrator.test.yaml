# Azure test environment (AKS). Production components and Entra ID everywhere;
# differences from prod are listed in docs/AZURE_TEST_ENV.md. Tenant-specific
# values (tenant id, app ids, caller identities, hosts) are NOT in this file:
# the Helm chart sets them as ORCH__... environment overrides from the values
# generated by deploy/azure/deploy.sh, so this file validates on its own.
#
# profile stays "dev" only because in-cluster traffic is plain HTTP (no service
# mesh in the test cluster); every other production rule is followed.
profile: dev
service:
  name: orchestrator
  environment: test
  cell_id: test-cell-01
  region: switzerlandnorth
  log_level: INFO
auth:
  # Callers present Entra app-only tokens from Workload Identity; route_callers
  # lists their managed identity client ids (set by Helm).
  mode: jwt
  jwt:
    algorithms: [RS256]
  user_subject_claim: oid
  user_tenant_claim: tid
  # Test tenants rarely have Conditional Access authentication contexts, so the
  # assurance level is carried by app roles on the orchestrator app (values
  # low, standard, stepup). Approvals additionally force an interactive re-login.
  user_acr_claim: roles
  acr_levels: [low, standard, stepup]
  approval_min_acr: stepup
  user_jwt:
    algorithms: [RS256]
catalogue:
  intents_file: /etc/orchestrator/intents.yaml
  registry_file: /etc/orchestrator/agents.yaml
routing:
  fallback_intent: faq.general
budgets:
  turn_deadline_ms: 2500
execution:
  default_step_timeout_ms: 1500
  read_retries: 2
a2a:
  gateway_url: http://a2a-gateway.agents.svc.cluster.local:8080
policy:
  engine: opa
  opa_url: http://127.0.0.1:8181
  timeout_ms: 250
identity:
  mode: entra_obo
  client_auth: workload_identity
  sender_constraint: mtls
session:
  store: redis
  redis_url_env: ORCH_REDIS_URL
  token_encryption_key_env: ORCH_SESSION_KEY
audit:
  sink: postgres
  postgres_dsn_env: ORCH_AUDIT_DSN
  fail_turn_on_audit_error: true
guards:
  injection_action: block
workflows:
  enabled: true
  temporal_target: temporal.platform.svc.cluster.local:7233
  namespace: orchestrator-test
  task_queue: orchestrator-transactions
  approval_timeout_s: 600
telemetry:
  enabled: true
  otlp_endpoint: http://otel-collector.platform.svc.cluster.local:4317
  capture_content: false
command_center:
  enabled: true
  event_bus: redis
  stream_key: orch:test-cell-01:events
  operator_auth: jwt
  operator_jwt:
    algorithms: [RS256]
  # Testers see (PII-redacted) utterances when they hold CC.Investigator.
  show_utterances: true
  require_four_eyes: true
  evals_file: /etc/orchestrator/evals.yaml
